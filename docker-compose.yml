services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnforlearning
      POSTGRES_USER: learnforlearning
      POSTGRES_PASSWORD: learnforlearning
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnforlearning -d learnforlearning"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed for local inspection; remove if you don't need host access.
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/learnforlearning
      DB_USERNAME: learnforlearning
      DB_PASSWORD: learnforlearning
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  db-data:
