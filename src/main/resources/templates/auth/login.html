<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Bejelentkezés', ~{:: content})}">
<body>
<th:block th:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Bejelentkezés</div>
                    <div class="card-body">
                        <div th:if="${param.error}" class="alert alert-danger">
                            Hibás e-mail cím vagy jelszó.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success">
                            Sikeresen kijelentkeztél.
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success">
                            Sikeres regisztráció! Most már bejelentkezhetsz.
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">E-mail cím</label>
                                <input type="email" id="username" name="username" class="form-control"
                                       autocomplete="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Jelszó</label>
                                <input type="password" id="password" name="password" class="form-control"
                                       autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Bejelentkezés</button>
                            <a th:href="@{/register}" class="btn btn-link">Még nincs fiókod?</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
