<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Jegy módosítása', ~{:: content})}">
<body>
<th:block th:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Jegy módosítása – <span th:text="${subject.name}">Tárgy</span>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/newsubject/{id}/update(id=${subject.id})}" method="post">
                            <div class="mb-3">
                                <label for="grade" class="form-label">Jegy (1–5)</label>
                                <input type="number" id="grade" name="grade" min="1" max="5"
                                       class="form-control" th:value="${grade}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Mentés</button>
                            <a th:href="@{/newsubject}" class="btn btn-link">Mégse</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
