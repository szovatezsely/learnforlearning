<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Új jegyek felvétele', ~{:: content})}">
<body>
<th:block th:fragment="content">
    <div class="container">
        <h1 class="mb-4">Új jegyek felvétele</h1>

        <div class="card mb-5">
            <div class="card-header">Új jegy hozzáadása</div>
            <div class="card-body">
                <form th:action="@{/subjects/add}" th:object="${gradeForm}" method="post" class="row g-3">
                    <div class="col-md-7">
                        <label for="subjectId" class="form-label">Tárgy</label>
                        <select id="subjectId" class="form-select" th:field="*{subjectId}"
                                th:classappend="${#fields.hasErrors('subjectId')} ? 'is-invalid'">
                            <option value="">Válassz tárgyat...</option>
                            <option th:each="s : ${gradableSubjects}" th:value="${s.id}" th:text="${s.name}">Tárgy</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('subjectId')}" th:errors="*{subjectId}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="grade" class="form-label">Jegy (1–5)</label>
                        <input type="number" id="grade" min="1" max="5" class="form-control" th:field="*{grade}"
                               th:classappend="${#fields.hasErrors('grade')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></div>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Hozzáadás</button>
                    </div>
                </form>
            </div>
        </div>

        <h2 class="h4 mb-3">Eddig felvett jegyeid</h2>
        <div th:if="${grades.isEmpty()}" class="alert alert-secondary">Még nem vettél fel jegyet.</div>
        <div class="table-responsive" th:unless="${grades.isEmpty()}">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Tárgy</th>
                    <th>Jegy</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="grade : ${grades}">
                    <td th:text="${grade.subject.name}">Tárgy</td>
                    <td th:text="${grade.value}">0</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/newsubject/{id}/edit(id=${grade.subject.id})}">Módosítás</a>
                        <form class="d-inline" th:action="@{/newsubject/{id}/delete(id=${grade.subject.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Törlés</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
