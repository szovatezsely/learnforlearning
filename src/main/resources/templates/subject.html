<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(${subject.name}, ~{:: content})}">
<body>
<th:block th:fragment="content">
    <div class="container">
        <h1 th:text="${subject.name}">Tárgy</h1>
        <p class="text-muted">
            <span th:text="${subject.code}">KÓD</span> ·
            <span th:text="${subject.creditPoints}">0</span> kredit ·
            <span th:text="${subject.evenSemester} ? 'Tavaszi félév' : 'Őszi félév'">—</span>
        </p>
        <a th:href="${subject.url}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-primary mb-4">
            Tematika megtekintése
        </a>

        <h2 class="h4">Oktatók</h2>
        <div th:if="${ratings.isEmpty()}" class="alert alert-secondary">
            Ehhez a tárgyhoz még nincs aktív oktató rögzítve.
        </div>

        <div class="row row-cols-1 row-cols-md-2 g-3">
            <div class="col" th:each="rating : ${ratings}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${rating.teacher().name}">Oktató</h5>
                        <p class="card-text">Pontszám:
                            <span class="badge bg-secondary" th:text="${rating.points()}">0</span>
                        </p>

                        <div sec:authorize="isAuthenticated()" class="d-flex gap-2 flex-wrap">
                            <form th:action="@{/subject/vote}" method="post">
                                <input type="hidden" name="teacherId" th:value="${rating.teacher().id}">
                                <input type="hidden" name="subjectId" th:value="${subject.id}">
                                <input type="hidden" name="positive" value="true">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${rating.userUpvoted()} ? 'btn-success' : 'btn-outline-success'">
                                    👍 <span th:text="${rating.userUpvoted()} ? 'Feloldás' : 'Tetszik'">Tetszik</span>
                                </button>
                            </form>
                            <form th:action="@{/subject/vote}" method="post">
                                <input type="hidden" name="teacherId" th:value="${rating.teacher().id}">
                                <input type="hidden" name="subjectId" th:value="${subject.id}">
                                <input type="hidden" name="positive" value="false">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${rating.userDownvoted()} ? 'btn-danger' : 'btn-outline-danger'">
                                    👎 <span th:text="${rating.userDownvoted()} ? 'Feloldás' : 'Nem tetszik'">Nem tetszik</span>
                                </button>
                            </form>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/subject/comment(teacherId=${rating.teacher().id},subjectId=${subject.id})}">
                                Megjegyzés írása
                            </a>
                        </div>

                        <a class="btn btn-sm btn-link px-0 mt-2"
                           th:href="@{/subject/{id}/comments(id=${rating.teacher().id},subjectId=${subject.id})}">
                            Megjegyzések megtekintése
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/subjects}" class="btn btn-outline-secondary">Vissza a listához</a>
        </div>
    </div>
</th:block>
</body>
</html>
